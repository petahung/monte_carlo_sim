<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle (dark) -->
  <circle cx="32" cy="32" r="30" fill="#1a1a2e" stroke="#4a4a6a" stroke-width="2"/>

  <!-- Revolver cylinder (6 chambers) -->
  <circle cx="32" cy="32" r="18" fill="#2a2a4a" stroke="#6a6a9a" stroke-width="2"/>

  <!-- 6 chamber holes -->
  <!-- Top -->
  <circle cx="32" cy="17" r="4.5" fill="#0a0a1a" stroke="#8a8aaa" stroke-width="1.2"/>
  <!-- Top-right -->
  <circle cx="44" cy="24" r="4.5" fill="#0a0a1a" stroke="#8a8aaa" stroke-width="1.2"/>
  <!-- Bottom-right -->
  <circle cx="44" cy="40" r="4.5" fill="#0a0a1a" stroke="#8a8aaa" stroke-width="1.2"/>
  <!-- Bottom -->
  <circle cx="32" cy="47" r="4.5" fill="#0a0a1a" stroke="#8a8aaa" stroke-width="1.2"/>
  <!-- Bottom-left -->
  <circle cx="20" cy="40" r="4.5" fill="#0a0a1a" stroke="#8a8aaa" stroke-width="1.2"/>
  <!-- Top-left -->
  <circle cx="20" cy="24" r="4.5" fill="#0a0a1a" stroke="#8a8aaa" stroke-width="1.2"/>

  <!-- One bullet (red highlight in top chamber) -->
  <circle cx="32" cy="17" r="2.5" fill="#e63946"/>

  <!-- Center pin -->
  <circle cx="32" cy="32" r="3.5" fill="#6a6a9a" stroke="#aaaacc" stroke-width="1"/>

  <!-- Gun barrel pointing right -->
  <rect x="48" y="29.5" width="13" height="5" rx="2" fill="#3a3a5a" stroke="#6a6a9a" stroke-width="1"/>
  <!-- Barrel tip -->
  <rect x="59" y="28" width="3" height="8" rx="1" fill="#2a2a4a" stroke="#6a6a9a" stroke-width="1"/>

  <!-- Grip handle (bottom left) -->
  <path d="M16 38 Q10 42 9 50 Q10 56 14 57 Q18 58 20 54 L22 44 Z" fill="#3a2a1a" stroke="#5a4a3a" stroke-width="1"/>
</svg>
